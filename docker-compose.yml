# Local debugging only -- not used in CI or production deployment.
# Credentials go in a real per-tenant request header, never here.
services:
  airtable-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8080
